name: VLDB 2026 LangChain Package Tests

on:
  pull_request:
    branches: [vldb_2026]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "packages/powermem-langchain/**"
      - ".github/workflows/vldb.yml"
  workflow_dispatch:

jobs:
  langchain-package:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run package contract tests
        run: |
          uv run --no-project \
            --python "${{ matrix.python-version }}" \
            --with-editable "." \
            --with-editable "packages/powermem-langchain[test]" \
            pytest packages/powermem-langchain/tests -q
